! =============================================================================
! nfacctd (pmacct) - coletor NetFlow v5/v9 e IPFIX
! Recebe dos roteadores, normaliza pela taxa de amostragem, agrega em baldes de
! 1 minuto e grava no MySQL (tabelas flow_dst e flow_src_port).
! =============================================================================

daemonize: false
maps_refresh: false
nfacctd_ip: 0.0.0.0
nfacctd_port: 2055

! Usa o relogio do coletor para posicionar os fluxos nos baldes (relogios de
! roteador costumam estar errados e fluxos longos chegam atrasados).
nfacctd_time_new: true

! Multiplica pacotes/bytes pela taxa de amostragem (1:N) para estimar o trafego real.
! A taxa vem do proprio export (v5 header / options template v9 e IPFIX) ou,
! se o roteador nao informar, do arquivo sampling.map.
nfacctd_renormalize: true
sampling_map: /etc/pmacct/sampling.map

! Evita descartar pacotes de export em rajadas (ataques geram muito fluxo).
nfacctd_pipe_size: 8388608
plugin_buffer_size: 4096000
plugin_pipe_size: 40960000

plugins: mysql[dst], mysql[sport], mysql[syn]

! --- Visao por destino (quem esta recebendo trafego) -------------------------
aggregate[dst]: peer_src_ip, in_iface, dst_host, proto, tcpflags, flows
sql_table[dst]: flow_dst

! --- Visao por porta de origem (assinaturas de amplificacao: 53, 123, 11211) -
aggregate[sport]: peer_src_ip, in_iface, proto, src_port, flows
sql_table[sport]: flow_src_port

! --- Fluxos "so SYN" por destino (deteccao de SYN flood) ---------------------
! O tcpflags de flow_dst e um OR acumulado: ACK legitimo esconde o SYN. Por
! isso o pre_tag_map marca os fluxos com flags == 0x02 e so este plugin os recebe.
pre_tag_map: /etc/pmacct/pretag.map
aggregate[syn]: peer_src_ip, in_iface, dst_host, flows
sql_table[syn]: flow_syn

! Obs.: nao ha agregacao por porta de DESTINO aqui de proposito: no trafego de
! entrada a porta de destino quase sempre e efemera (dezenas de milhares de
! linhas por minuto). A porta alvo de um ataque sera consultada por vitima na
! fase de deteccao (agregado dst_host + proto + dst_port, so para IPs suspeitos).

sql_optimize_clauses: true
! Os @VALORES@ abaixo sao preenchidos por pmacct/entrypoint.sh a partir das
! variaveis de ambiente do container (SQL_HOST, SQL_DB, SQL_USER, SQL_PASSWD).
sql_host: @SQL_HOST@
sql_port: @SQL_PORT@
sql_db: @SQL_DB@
sql_user: @SQL_USER@
sql_passwd: @SQL_PASSWD@

! Baldes de 1 minuto, gravados a cada 15 s (a mesma linha e atualizada).
sql_history: 1m
sql_history_roundoff: m
sql_refresh_time: 15
sql_cache_entries: 99991
sql_table_version: 9
